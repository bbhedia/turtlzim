# Production, on a version tag `vX.Y.Z` (docs/zim-delivery.md). The checks of a pull request (ci.yml), then the release of this version (the server and the web app as they were built and tested here), kept as an artifact of this run.
# WHERE it goes is not decided yet (Railway, or an alternative in the EU): the step that belongs to the hoster is the last job, and it does not run until the repository variable PRODUCTION_TARGET says which hoster it is (Settings > Secrets and
# variables > Actions > Variables). Everything before it is the same whichever the hoster is. The same tag also makes the installers and a draft release (desktop.yml); this workflow does not wait for that one, and that one does not wait for this.
name: cd-production

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      - name: the release of this version
        run: node scripts/deploy/make-release.mjs --out release --commit "$GITHUB_SHA" --channel production --install npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release
          path: release
          if-no-files-found: error

  # The step that belongs to the hoster. Written when the hoster is chosen (docs/zim-delivery.md, "Production"): take the artifact `production-release`, put it where the hoster runs it, ask the server
  # (scripts/deploy/smoke-test.mjs ADDRESS), and say so. Until then it does not run; and if the variable is set before the step is written, it fails and says that, instead of letting a tag look delivered.
  deploy:
    needs: build
    if: ${{ vars.PRODUCTION_TARGET != '' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: the hoster
        env:
          TARGET: ${{ vars.PRODUCTION_TARGET }}
        run: |
          echo "::error title=cd-production::PRODUCTION_TARGET is '$TARGET', but the step that delivers to it is not written yet (docs/zim-delivery.md, 'Production'): nothing was delivered."
          exit 1
