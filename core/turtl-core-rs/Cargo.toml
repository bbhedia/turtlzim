[workspace]
members = ["carrier", "clippo", "config", "clouseau", "dumpy", "jedi", "migrate"]
exclude = ["integration-tests", "cwrap", "client", "sock"]

[package]
name = "turtl_core"
version = "0.1.2"
authors = ["Andrew Danger Lyon <orthecreedence@gmail.com>"]
license = "GPL-3.0"

[lib]
name = "turtl_core"
crate-type = ["cdylib"]		# ["dylib", "staticlib"]
doctest = false				# these annoy me

[features]
sqlite-static = ["rusqlite/bundled"]
build-jni = ["jni"]
panic-on-error = ["migrate/panic-on-error"]
public-api-tests = []

[dependencies]
base64 = "0.9.1"
carrier = { path = "carrier" }
config = { path = "config" }
crossbeam = "0.3.0"
encoding_rs = "0.8.6"
fern = "0.5.5"
futures = "0.1.14"
glob = "0.2.11"
hex = "0.3.2"
jedi = { path = "jedi" }
jni = { version = "0.10.1", optional = true }
lazy_static = "1.4.0"
lib_permissions = { git = "https://github.com/turtl/lib-permissions", tag = "v0.1.3" }
log = "0.4.1"
log-panics = { version = "2.0.0", features = ["with-backtrace"] }
protected_derive = { path = "protected_derive" }
quick-error = "1.2.2"
serde = "1.0.8"
serde_derive = "1.0.8"
serde_json = "1.0.2"
time = "0.1.35"
url = "2.1.1"

# --- native-only dependencies ---
# These either have no wasm32-unknown-unknown build story at all (native C
# libraries via a build.rs: rusqlite/libsqlite3-sys and dumpy/clouseau which
# wrap it, sodiumoxide/libsodium-sys, rust-crypto via the `migrate` crate) or
# pull in a transitive dependency that doesn't support wasm32 (regex 0.1.x ->
# thread-id/memchr 0.1, clippo -> regex + scraper/html5ever + blocking
# reqwest). Each is a separate, already-decided future milestone per
# docs/wasm-port-plan.md (§2.1 crypto, §2.2 storage) or, for clippo/migrate,
# out of scope for the port entirely for now. See the matching
# `#[cfg(target_arch = "wasm32")]` stubs at each crate's call sites
# (src/storage_wasm.rs, src/search_wasm.rs, src/crypto/low.rs, etc).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clippo = { path = "clippo" }
clouseau = { path = "clouseau" }
dumpy = { path = "dumpy" }
fs2 = "0.4.3"
migrate = { path = "migrate" }
num_cpus = "1.8.0"
futures-cpupool = "0.1.5"
regex = "0.1.77"
reqwest = { version = "0.10.4", features = ["blocking", "json"] }
rusqlite = "0.20.0"
sodiumoxide = "0.0.16"

# wasm32-only dependencies
# `http` is what reqwest re-exports its own `Method`/`StatusCode` types from
# (`pub use http::{Method, StatusCode}` in reqwest 0.10.x) -- depending on it
# directly for wasm32 keeps api.rs's wasm32 stub using the *same* types as the
# native reqwest-backed code, not a look-alike duplicate. Pure Rust, no C deps.
[target.'cfg(target_arch = "wasm32")'.dependencies]
http = "0.2.12"

