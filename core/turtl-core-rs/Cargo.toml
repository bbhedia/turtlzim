[workspace]
# Resolver 2 keeps the features of target-specific dependencies apart: native `tokio` (rt-multi-thread,
# plus `net` from hyper) must not leak into the wasm32 graph, where `sqlite-wasm-vfs` brings its own
# `tokio` (just `sync`) and mio refuses to build. (Edition 2018 defaults to resolver 1.)
resolver = "2"
members = ["carrier", "clippo", "config", "clouseau", "dumpy", "jedi", "migrate"]
exclude = ["integration-tests", "cwrap", "client", "sock"]

[package]
name = "turtl_core"
edition = "2018"
version = "0.1.2"
authors = ["Andrew Danger Lyon <orthecreedence@gmail.com>"]
license = "GPL-3.0"

[lib]
name = "turtl_core"
crate-type = ["cdylib"]		# ["dylib", "staticlib"]
doctest = false				# these annoy me

[features]
sqlite-static = ["rusqlite/bundled"]
build-jni = ["jni"]
panic-on-error = ["migrate/panic-on-error"]
public-api-tests = []

[dependencies]
base64 = "0.9.1"
carrier = { path = "carrier" }
clouseau = { path = "clouseau" }
config = { path = "config" }
crossbeam = "0.3.0"
dumpy = { path = "dumpy" }
encoding_rs = "0.8.6"
fern = "0.5.5"
futures = "0.1.14"
# futures 0.3, for the async code (std's `Future`): a oneshot channel for task completion and
# `catch_unwind` on futures (src/util/exec.rs). Both are already in the build via reqwest/hyper.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.2.11"
hex = "0.3.2"
jedi = { path = "jedi" }
jni = { version = "0.10.1", optional = true }
lazy_static = "1.4.0"
lib_permissions = { git = "https://github.com/turtl/lib-permissions", tag = "v0.1.3" }
log = "0.4.1"
log-panics = { version = "2.0.0", features = ["with-backtrace"] }
protected_derive = { path = "protected_derive" }
quick-error = "1.2.2"
# rusqlite 0.40 swaps in `sqlite-wasm-rs` (real SQLite compiled to wasm32) by itself on
# wasm32-unknown-unknown, so dumpy/clouseau/storage.rs/search.rs run the same source on every
# target (docs/wasm-port-plan.md decision 2.2 and 2.2.1). The `sqlite-static` feature above only
# matters natively (it bundles SQLite instead of linking the system library).
rusqlite = "0.40"
serde = "1.0.8"
serde_derive = "1.0.8"
serde_json = "1.0.2"
time = "0.1.35"
url = "2.1.1"

# --- native-only dependencies ---
# These either have no wasm32-unknown-unknown build story at all (native C
# libraries via a build.rs: sodiumoxide/libsodium-sys, rust-crypto via the
# `migrate` crate), pull in a transitive dependency that doesn't support
# wasm32 (regex 0.1.x -> thread-id/memchr 0.1, clippo -> regex +
# scraper/html5ever + blocking reqwest 0.10), or only make sense with real OS
# threads (the tokio runtime that drives async fns on native). See the matching
# `#[cfg(target_arch = "wasm32")]` stubs at each crate's call sites. SQLite and
# HTTP are deliberately NOT here: rusqlite/dumpy/clouseau and reqwest build for
# wasm32 too (see [dependencies] above and the wasm32 table below).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clippo = { path = "clippo" }
fs2 = "0.4.3"
migrate = { path = "migrate" }
num_cpus = "1.8.0"
futures-cpupool = "0.1.5"
regex = "0.1.77"
# reqwest 0.13: async HTTP (docs/wasm-port-plan.md decision 2.3). Same API on both targets; this is
# the hyper-backed client with the OS TLS library.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
sodiumoxide = "0.0.16"
# The runtime reqwest's I/O needs, shared by every thread that drives an async fn (util/exec.rs).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }

# wasm32-only dependencies
# reqwest on wasm32 is its fetch backend: the same async API as native, over the global `fetch`
# (browsers, workers and Node 18+; verified under Node against a real local server).
#
# wasm-bindgen/js-sys/wasm-bindgen-futures back the injected-libsodium crypto
# (src/crypto/wasm_sodium.rs, docs/wasm-port-plan.md decision 2.1) and the JS timer/task helpers
# in src/util/exec.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.5", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Persistence: the OPFS "SAHPool" VFS for the SQLite that rusqlite already links on wasm32 (a
# separate crate from `sqlite-wasm-rs` since that one's 0.5 line; 0.2.x is the one built against
# it). `sqlite-wasm-rs` is named here only for the OS callbacks the VFS wants. See
# src/wasm_host.rs (`enablePersistence`) and docs/wasm-port-plan.md decision 2.2.1.
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = "0.2"

# wasm-bindgen-test drives real wasm32 execution (via `wasm-pack test --node`)
# for the crypto bridge's golden-vector parity tests in src/crypto/mod.rs.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

