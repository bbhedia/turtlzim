[package]
name = "zim-notebook-desktop"
version = "0.1.0"
edition = "2021"
description = "The Zim notebook web app as a program for Windows and Linux"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: the web toolkit of a computer (WebKitGTK, WebView2) must not enter the core's, whose crates build for wasm and for tests
# without any of it.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# (to reach the settings of the WebKitGTK view: see `linux_web_features` in main.rs; the version is the one Tauri itself uses)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
